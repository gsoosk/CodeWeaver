# CodeWeaver project config for a CRUST-Bench C -> safe-Rust transpilation task.
#
# GENERATED by setup.ps1 / setup.sh from codeweaver.template.toml — do not edit by
# hand; re-run setup to retarget a different benchmark project. See README.md.
#
# Task: transpile the C repository `__PROJECT__` into safe, idiomatic Rust that
# conforms to the provided Rust interface and passes the provided Rust tests
# (CRUST-Bench, arXiv:2504.15254).

[project]
name = "crust-bench-__PROJECT__"
slug = "crust-bench-__PROJECT__"
description = "CRUST-Bench: transpile the C project '__PROJECT__' into safe idiomatic Rust conforming to the provided interface and passing the provided tests."

[translation]
source_language = "C"
target_language = "Rust"
brief_file = "brief.md"

[paths]
# `root` defaults to this config's directory (examples/crust-bench).
source_dir = "__C_SOURCE_ABS__"                       # the C repository to transpile (read-only)
reference_dirs = ["__IFACE_ABS__", "__TESTS_ABS__"]   # the Rust interface (contract) + tests (oracle), read-only
immutable_input = ".scaffold"                         # a clean copy of the RBench crate (interfaces + tests + Cargo); copied to working_copy, never edited
working_copy = "pipeline/crate"                       # the crate the agents fill with implementations
pipeline_dir = "pipeline"

[commands]
# Run from this example dir (the agent's cwd). Pure Rust; needs cargo on PATH.
build_check = "cargo build --manifest-path pipeline/crate/Cargo.toml"
unit_test  = "cargo test --manifest-path pipeline/crate/Cargo.toml -- {gate}"
validate   = "cargo test --manifest-path pipeline/crate/Cargo.toml -- {gate}"

[validation]
# cargo test accepts multiple test-name filters after `--` (OR match).
gate_template = "{tests_space}"

[model]
default = "claude-opus-4.8"
effort_default = "high"
[model.effort]
analyzer = "max"
scoper = "max"
planner = "max"
translator = "max"
validator = "high"
parity = "max"

[execution]
max_iter = 6
parity_check = true
max_parity_rounds = 3

# No [[milestones]] declared: the scope stage reads the interface + tests and
# generates a cumulative milestone matrix (skeleton -> function groups -> full
# suite). The parity verifier then confirms every interface function / C behavior
# is implemented before the run terminates.
