# CodeWeaver project config: Apache Commons Validator (routines) Java -> Python.
#
# GENERATED by setup.ps1 / setup.sh from codeweaver.template.toml — do not edit by
# hand; re-run setup to point at your commons-validator checkout. See README.md.
#
# Task: translate the self-contained `routines` package of Apache Commons Validator
# (https://github.com/apache/commons-validator) from Java into an idiomatic Python
# package, with the JUnit tests translated into Python unittest as the oracle.

[project]
name = "commons-validator-java2py"
slug = "commons-validator-java2py"
description = "Translate Apache Commons Validator's routines package (email/URL/domain/IBAN/ISBN/credit-card/date/number validators + check-digit algorithms) from Java to idiomatic Python, validated by the translated unittest suite."

[translation]
source_language = "Java"
target_language = "Python"
brief_file = "brief.md"

[paths]
# `root` defaults to this config's directory (examples/commons-validator).
source_dir = "__ROUTINES_MAIN__"                 # the Java `routines` package to translate (read-only)
reference_dirs = ["__ROUTINES_TEST__"]           # the JUnit tests = behavioral spec (read-only; translated, not run)
working_copy = "pipeline/commons_validator"      # the Python package + translated tests the agents create
pipeline_dir = "pipeline"

[commands]
# Pure Python, stdlib only (no third-party deps). Tests run from the working copy.
build_check = "python -c \"import sys; sys.path.insert(0, r'pipeline/commons_validator'); import commons_validator; print('ok')\""
unit_test  = "bash -lc \"cd pipeline/commons_validator && python -m unittest {gate}\""
validate   = "bash -lc \"cd pipeline/commons_validator && python -m unittest {gate}\""

[validation]
# Cumulative gate -> space-separated unittest selectors (python -m unittest a b c).
gate_template = "{tests_space}"

[model]
default = "claude-opus-4.8"
effort_default = "high"
[model.effort]
analyzer = "max"
scoper = "max"
planner = "max"
translator = "max"
validator = "high"
parity = "max"

[execution]
max_iter = 6
parity_check = true
max_parity_rounds = 4

# No [[milestones]] declared: the scope stage reads the validators + tests and
# generates a cumulative, dependency-ordered milestone matrix (check-digit
# algorithms -> base classes -> concrete validators). The parity verifier then
# confirms every Java routine class has a faithful Python counterpart.
