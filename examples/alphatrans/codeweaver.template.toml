# CodeWeaver project config: AlphaTrans subject `__PROJECT__`, Java -> Python.
#
# GENERATED by setup.ps1 / setup.sh from ../../codeweaver.template.toml — do not edit
# by hand; re-run setup to regenerate. See ../../README.md.
#
# dataset_root = __DATASET_ROOT__
# subject      = __PROJECT__
#
# This config lives in examples/alphatrans/subjects/__PROJECT__/, so [paths].root —
# and therefore the agents' working directory — is THIS directory. Every subject gets
# its own scaffold, oracle, pipeline and Burr state, so a campaign over several
# projects never clobbers a previous subject's artifacts.
#
# Task: translate the Java repository `__PROJECT__` into Python that satisfies the
# provided Python interface skeleton and passes AlphaTrans's MANUALLY VERIFIED Python
# test suite (FSE 2025, arXiv:2410.24117). The oracle is human-written, is never
# authored or edited by the agents, and is never present in the working copy —
# ../../tools/oracle.{ps1,sh} stages it into a throwaway tree at validation time and
# verifies its SHA256 manifest before every scored run.

[project]
name = "alphatrans-__PROJECT__"
slug = "alphatrans-__PROJECT_SLUG__"
description = "AlphaTrans: translate the Java project '__PROJECT__' into Python conforming to the provided interface skeleton and passing the manually verified pytest oracle."

[translation]
source_language = "Java"
target_language = "Python"
brief_file = "../../brief.md"

[paths]
source_dir = "__JAVA_SRC_ABS__"     # the Java repository to translate (read-only)
immutable_input = ".scaffold"       # interface skeleton (typed signatures, `pass` bodies); copied to working_copy, never edited
working_copy = "pipeline/project"   # the Python package the agents fill in (src/main/**)
pipeline_dir = "pipeline"
# NOTE: `reference_dirs` deliberately does NOT include the oracle. The tests are the
# hidden held-out oracle; granting --add-dir on them would defeat the test-blind
# protocol. The interface skeleton inside working_copy is the agents' contract.

[commands]
# Run from this subject directory (= [paths].root = the agents' cwd).
#   build_check : every module must import cleanly (the Python analogue of "it compiles").
#   unit_test   : LAYER 1 — the agents' OWN tests, inside the working copy. Never the oracle.
#   validate    : LAYER 2 — the fixed, human-written oracle, via the isolating harness.
build_check = "python ../../tools/build_check.py"
unit_test   = "python -m pytest pipeline/project/tests -q"
# A TOML *literal* string (single quotes): no escape processing, so the embedded
# double quotes around {gate} survive verbatim. A basic "..." string here would need
# backslash escapes that generators mangle.
validate    = '__VALIDATE_CMD__'

[validation]
# Cumulative gate -> space-separated mechanical <Class>Test tokens. tools/oracle.*
# resolves each token to the exact oracle test FILE. It deliberately does not use
# `pytest -k`, whose SUBSTRING matching would let "OptionTest" also select
# "ArgumentIsOptionTest" and "PatternOptionBuilderTest" — dragging later milestones'
# tests into an earlier gate and failing it for work it was never asked to do.
gate_template = "{tests_space}"
# Deferred (skip-on-give-up) tests are deselected by the harness, which reads
# pipeline/skips.json directly and passes --deselect for each node id.
skip_exclude_template = ""

[model]
default = "claude-opus-4.8"
effort_default = "high"
[model.effort]
analyzer = "max"
scoper = "max"
planner = "max"
translator = "max"
validator = "high"
parity = "max"

[execution]
max_iter = 6
parity_check = true
max_parity_rounds = 4

# No [[milestones]] declared: the scope stage reads the Java source and the Python
# interface skeleton — NOT the oracle tests — and generates a cumulative,
# dependency-ordered milestone matrix. The parity verifier then confirms every Java
# class has a faithful Python counterpart with no `pass`/`NotImplementedError` stubs
# left behind.
