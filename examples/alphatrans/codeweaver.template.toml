# CodeWeaver project config: AlphaTrans subject `__PROJECT__`, Java -> Python.
#
# GENERATED by setup.ps1 / setup.sh from codeweaver.template.toml — do not edit by
# hand; re-run setup to retarget another project. See README.md.
#
# dataset_root = __DATASET_ROOT__
#
# Task: translate the Java repository `__PROJECT__` into Python that satisfies the
# provided Python interface skeleton and passes AlphaTrans's MANUALLY VERIFIED
# Python test suite (FSE 2025, arXiv:2410.24117). The oracle is human-written, is
# never authored or edited by the agents, and is never present in the working copy
# — tools/oracle.ps1 stages it into a throwaway tree at validation time and
# verifies its SHA256 manifest before every scored run.

[project]
name = "alphatrans-__PROJECT__"
slug = "alphatrans-__PROJECT_SLUG__"
description = "AlphaTrans: translate the Java project '__PROJECT__' into Python conforming to the provided interface skeleton and passing the manually verified pytest oracle."

[translation]
source_language = "Java"
target_language = "Python"
brief_file = "brief.md"

[paths]
# `root` defaults to this config's directory (examples/alphatrans).
source_dir = "__JAVA_SRC_ABS__"     # the Java repository to translate (read-only)
immutable_input = ".scaffold"       # interface skeleton (typed signatures, `pass` bodies); copied to working_copy, never edited
working_copy = "pipeline/project"   # the Python package the agents fill in (src/main/**)
pipeline_dir = "pipeline"
# NOTE: `reference_dirs` deliberately does NOT include the oracle. The tests are the
# hidden held-out oracle; granting --add-dir on them would defeat the test-blind
# protocol. The interface skeleton inside working_copy is the agents' contract.

[commands]
# Run from this example dir (the agent's cwd).
#   build_check : every module must import cleanly (the Python analogue of "it compiles").
#   unit_test   : LAYER 1 — the agents' OWN tests, inside the working copy. Never the oracle.
#   validate    : LAYER 2 — the fixed, human-written oracle, via the isolating harness.
build_check = "python tools/build_check.py"
unit_test   = "python -m pytest pipeline/project/tests -q"
validate    = "pwsh -NoProfile -File tools/oracle.ps1 -Gate \"{gate}\""

[validation]
# Cumulative gate -> a pytest -k expression (OR-joined test class/function selectors).
gate_template = "{tests_or}"
skip_exclude_template = " and not ({tests_or})"

[model]
default = "claude-opus-4.8"
effort_default = "high"
[model.effort]
analyzer = "max"
scoper = "max"
planner = "max"
translator = "max"
validator = "high"
parity = "max"

[execution]
max_iter = 6
parity_check = true
max_parity_rounds = 4

# No [[milestones]] declared: the scope stage reads the Java source and the Python
# interface skeleton — NOT the oracle tests — and generates a cumulative,
# dependency-ordered milestone matrix. The parity verifier then confirms every Java
# class has a faithful Python counterpart with no `pass`/`NotImplementedError` stubs
# left behind.
