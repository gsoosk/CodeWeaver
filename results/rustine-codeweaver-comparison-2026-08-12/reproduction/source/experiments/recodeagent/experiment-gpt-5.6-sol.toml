# Frozen CodeWeaver GPT-5.6 Sol protocol for the direct system comparison
# against ReCodeAgent and the four paper baselines. This is deliberately a
# separate complete config: the original Claude reproduction remains immutable.

[paper]
arxiv_id = "2604.07341"
title_hint = "ReCodeAgent (multi-agent LLM code translation)"
official_artifact_commit = "3a178a6a99f34c76a37f732c0fd887dad279cf9f"
zenodo_record_id = "21399688"

[paper.protocol]
model = "claude-sonnet-4.5"
agent_timeout_seconds = 5000

[paper_reference.totals]
total_loc = 230000
validated_tests = 2107
translated_tests_excluding_crust = 1484
functions = 4583

[artifact]
project_root_subdir_candidates = ["data/tool_projects", "data/projects"]

[artifact.files.implementation_zip]
filename = "implementation.zip"
md5 = "a2151028151e0852ce4db060a22ac76a"
url = "https://zenodo.org/api/records/21399688/files/implementation.zip/content"

[artifact.files.results_xlsx]
filename = "results.xlsx"
md5 = "a404779f2dcd7ac44d43bf72f4e88b98"
url = "https://zenodo.org/api/records/21399688/files/results.xlsx/content"

[artifact.files.results_zip]
filename = "results.zip"
md5 = "5df332d2a1477ec30f719dd7d0ff2470"
url = "https://zenodo.org/api/records/21399688/files/results.zip/content"

[protocol]
model = "gpt-5.6-sol"
effort_default = "max"
agent_timeout_seconds = 5000
max_iter = 5
max_parity_rounds = 3
repetitions = 3

[datasets.crust]
label = "CRUST"
expected_count = 100
source_language = "C"
target_language = "Rust"
dir_candidates = ["CRUST", "crust", "CRUST-bench", "crust-bench", "CBench"]
source_subdir_candidates = ["CBench", "c", "C", "source", "src"]
oracle_subdir_candidates = ["RBench", "tests", "test"]
scaffold_subdir_candidates = ["rust", "interfaces", "interface", "scaffold"]
ground_truth_subdir_candidates = []
source_extensions = [".c", ".h"]
build_cmd = ["cargo", "build", "--manifest-path", "Cargo.toml"]
unit_test_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
validate_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
gate_template = "{tests_space}"
coverage_cmd = []
coverage_format = ""

[datasets.oxidizer]
label = "Oxidizer"
expected_count = 6
source_language = "Go"
target_language = "Rust"
dir_candidates = ["Oxidizer", "oxidizer"]
source_subdir_candidates = ["go", "source", "src"]
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
ground_truth_subdir_candidates = ["rust", "target", "reference", "solution"]
source_extensions = [".go"]
build_cmd = ["cargo", "build", "--manifest-path", "Cargo.toml"]
unit_test_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
validate_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
gate_template = "{tests_space}"
coverage_cmd = []
coverage_format = ""

[datasets.alphatrans]
label = "AlphaTrans"
expected_count = 4
source_language = "Java"
target_language = "Python"
dir_candidates = ["AlphaTrans", "alphatrans", "alpha-trans"]
source_subdir_candidates = ["java", "source", "src"]
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
ground_truth_subdir_candidates = ["python", "target", "reference", "solution"]
source_extensions = [".java"]
build_cmd = ["python", "-c", "import compileall,sys; sys.exit(0 if compileall.compile_dir('.', quiet=1) else 1)"]
unit_test_cmd = ["python", "-m", "pytest", "-q"]
validate_cmd = ["python", "-m", "pytest", "-q"]
gate_template = "-k \"{tests_or}\""
coverage_cmd = []
coverage_format = ""

[datasets.skel]
label = "SKEL"
expected_count = 8
source_language = "Python"
target_language = "JavaScript"
dir_candidates = ["SKEL", "skel"]
source_subdir_candidates = ["python", "source", "src"]
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
ground_truth_subdir_candidates = ["javascript", "js", "target", "reference", "solution"]
source_extensions = [".py"]
build_cmd = ["node", "--check", "index.js"]
unit_test_cmd = ["npm", "test", "--silent"]
validate_cmd = ["npm", "test", "--silent"]
gate_template = "{tests_space}"
coverage_cmd = []
coverage_format = ""
