# ReCodeAgent-paper reproduction harness -- pinned experiment protocol.
#
# This file describes WHAT is being reproduced (paper/artifact identity,
# dataset shape, default model/protocol) and HOW to discover/prepare/run it
# (dataset layout adapters, per-language commands). It is read-only input to
# every stage script (acquire/manifest/prepare/run/collect/analyze/report),
# all of which also accept CLI overrides -- this file supplies defaults, not
# hardcoded behavior.
#
# Nothing here is a MEASUREMENT. Numbers under [paper_reference] are what the
# paper reports; analyze.py must always keep those visually and structurally
# separate from anything this harness measures about CodeWeaver.

[paper]
arxiv_id = "2604.07341"
title_hint = "ReCodeAgent (multi-agent LLM code translation)"
official_artifact_commit = "3a178a6a99f34c76a37f732c0fd887dad279cf9f"
zenodo_record_id = "21399688"

# Reference protocol values from the paper. `model` / `agent_timeout_seconds`
# are what the PAPER used (Claude Sonnet 4.5, 5000s/agent). Model ID
# provenance (see common.py's own comment for the full trail): the official
# artifact's `.claude/settings.local.json` pins the precise underlying model
# as Bedrock identifier "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
# (family "claude-sonnet-4-5", snapshot 2025-09-29); this value uses the
# user-provided short form "claude-sonnet-4.5". CodeWeaver runs may use a
# different model/timeout (see [protocol] below); analyze.py/report.py must
# record which was actually used for each measured run and never conflate
# the two.
[paper.protocol]
model = "claude-sonnet-4.5"
agent_timeout_seconds = 5000

# 230K LoC / 2,107 validated tests / 1,484 translated tests (CRUST excluded) /
# 4,583 functions, as reported by the paper across all 118 projects.
[paper_reference.totals]
total_loc = 230000
validated_tests = 2107
translated_tests_excluding_crust = 1484
functions = 4583

# --------------------------------------------------------------------------- #
# Official artifact files (Zenodo record 21399688). acquire.py verifies these
# hashes before trusting anything extracted from them; it never fabricates a
# "verified" status for a file it has not hashed itself.
# --------------------------------------------------------------------------- #
# `project_root_subdir_candidates` is a relative-path, artifact-STRUCTURE fact
# (never a machine-specific absolute path -- those only ever come from CLI
# flags like --artifact-root/--workspace-root/--output-root): verified against
# a real extracted implementation.zip, the 118 benchmark projects live one
# level below the archive root at `data/tool_projects/{crust,oxidizer,
# alphatrans,skel}/<project>`, not directly at the root. manifest.py's
# resolve_project_root() tries --artifact-root itself first (so pointing
# directly at data/tool_projects, or any other layout with the dataset dirs
# at the root, keeps working) and only descends into these candidates if
# that fails. Safe to extend if a future artifact revision nests things
# differently -- config edit, not a code change.
[artifact]
project_root_subdir_candidates = ["data/tool_projects", "data/projects"]

[artifact.files.implementation_zip]
filename = "implementation.zip"
md5 = "a2151028151e0852ce4db060a22ac76a"
url = "https://zenodo.org/api/records/21399688/files/implementation.zip/content"

[artifact.files.results_xlsx]
filename = "results.xlsx"
md5 = "a404779f2dcd7ac44d43bf72f4e88b98"
url = "https://zenodo.org/api/records/21399688/files/results.xlsx/content"

[artifact.files.results_zip]
filename = "results.zip"
md5 = "5df332d2a1477ec30f719dd7d0ff2470"
url = "https://zenodo.org/api/records/21399688/files/results.zip/content"

# --------------------------------------------------------------------------- #
# CodeWeaver-side protocol for MEASURED runs (distinct from [paper.protocol]).
# Overridable per-invocation via CLI flags on run.py; these are just defaults.
# --------------------------------------------------------------------------- #
[protocol]
model = "claude-sonnet-4.5"        # Match the paper so architecture is the independent variable
# Claude Sonnet 4.5 does not expose Copilot CLI's configurable reasoning
# effort. Passing "high" makes the CLI reject every call before inference;
# "none" preserves the paper's model behavior and keeps the model fixed.
effort_default = "none"
agent_timeout_seconds = 5000       # mirrors the paper's 5,000 sec/agent cap
max_iter = 5
max_parity_rounds = 3
repetitions = 1                    # pass@1 by default; raise for pass@k / variance studies

# --------------------------------------------------------------------------- #
# Dataset layout adapters.
#
# Calibrated against a real, extracted official artifact (read-only WSL
# verification pass -- see README "Integration assumptions" for the full
# evidence trail). `dir_candidates` lists directory names (checked
# case-insensitively under the resolved project root -- see
# [artifact].project_root_subdir_candidates above -- first match wins);
# `manifest.py --probe <artifact-root>` still prints the real top-level tree
# for re-calibration if a future artifact revision ever renames things -- a
# config edit, never a code change.
# --------------------------------------------------------------------------- #
[datasets.crust]
label = "CRUST"
expected_count = 100
source_language = "C"
target_language = "Rust"
dir_candidates = ["CRUST", "crust", "CRUST-bench", "crust-bench", "CBench"]
source_subdir_candidates = ["CBench", "c", "C", "source", "src"]
# CRUST's developer tests are NESTED inside the source dir itself (verified:
# c/test/*_spec.c, sibling of c/src/), not a separate oracle directory -- no
# candidate here is expected to match, and that is correct: the tests are
# still included/counted because they are part of `c/`, copied wholesale as
# source_rel_path. Kept non-empty (rather than []) only in case a future
# artifact revision does ship a separate oracle dir.
oracle_subdir_candidates = ["RBench", "tests", "test"]
# CRUST is the one family where the paper's own provided Rust interface/test
# scaffold may be copied into the workspace as `immutable_input` (it is a
# contract + tests, not a solution) -- see prepare.py. Verified: the real
# directory is literally named `rust/` and its function bodies are
# `unimplemented!()` stubs (a contract, not a leaked solution).
scaffold_subdir_candidates = ["rust", "interfaces", "interface", "scaffold"]
ground_truth_subdir_candidates = []  # CRUST-Bench does not ship a full reference solution
source_extensions = [".c", ".h"]
build_cmd = ["cargo", "build", "--manifest-path", "Cargo.toml"]
unit_test_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
validate_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
gate_template = "{tests_space}"
# Generic fallback coverage stays unconfigured here. The calibrated evaluator
# runs cargo-tarpaulin over pristine CRUST developer binaries; after generated
# tests are classified, paper_test_compare.py adds their exact line union.
coverage_cmd = []
coverage_format = ""

[datasets.oxidizer]
label = "Oxidizer"
expected_count = 6
source_language = "Go"
target_language = "Rust"
dir_candidates = ["Oxidizer", "oxidizer"]
source_subdir_candidates = ["go", "source", "src"]
# Go's own convention embeds `*_test.go` files directly alongside source
# (verified: go/checkdigit_test.go etc., sibling files, not a sibling dir) --
# same "no separate oracle dir, tests are part of source_rel_path" pattern as
# CRUST above; no candidate here is expected to match.
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
# Verified: the real `rust/` dir is a complex, tool-generated tree (compiled
# `library/*.so`, `exec-snapshots/*.json`, `interoperation.json`,
# `src/__synthetic.rs`) -- Oxidizer's own reference translation, evaluator-only.
ground_truth_subdir_candidates = ["rust", "target", "reference", "solution"]
source_extensions = [".go"]
build_cmd = ["cargo", "build", "--manifest-path", "Cargo.toml"]
unit_test_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
validate_cmd = ["cargo", "test", "--manifest-path", "Cargo.toml"]
gate_template = "{tests_space}"
# collect.py records the official-harness standardized pair; after generated
# tests are classified, paper_test_compare.py runs exact CodeWeaver test
# selectors for the paper-equivalent pair.
coverage_cmd = []
coverage_format = ""

[datasets.alphatrans]
label = "AlphaTrans"
expected_count = 4
source_language = "Java"
target_language = "Python"
dir_candidates = ["AlphaTrans", "alphatrans", "alpha-trans"]
source_subdir_candidates = ["java", "source", "src"]
# Verified: developer tests live at java/src/test/ (nested in the source dir,
# same pattern as CRUST/Oxidizer above) -- no sibling oracle dir is expected.
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
# Verified: the real `python/` dir is a full, complete translation (real
# org/apache/commons/cli/*.py classes -- e.g. CommandLine.py, DefaultParser.py)
# plus a pytest harness (conftest.py/pytest.ini) with no test files of its own
# -- an evaluator-only ground-truth tree; translated tests get placed into
# its already-configured pytest layout, never pre-supplied.
ground_truth_subdir_candidates = ["python", "target", "reference", "solution"]
source_extensions = [".java"]
build_cmd = ["python", "-c", "import compileall,sys; sys.exit(0 if compileall.compile_dir('.', quiet=1) else 1)"]
unit_test_cmd = ["python", "-m", "pytest", "-q"]
validate_cmd = ["python", "-m", "pytest", "-q"]
gate_template = "-k \"{tests_or}\""
# collect.py records the official-harness standardized pair; paper_test_compare
# accumulates Coverage.py data from exact CodeWeaver-generated pytest node IDs.
coverage_cmd = []
coverage_format = ""

[datasets.skel]
label = "SKEL"
expected_count = 8
source_language = "Python"
target_language = "JavaScript"
dir_candidates = ["SKEL", "skel"]
source_subdir_candidates = ["python", "source", "src"]
# Verified (sampled 3/8 projects: bst, colorsys, mathgen): SKEL has no
# separate oracle *directory* -- developer tests are embedded directly
# inside source.py itself as test_*-prefixed functions co-located with the
# algorithm (e.g. test_put/test_search in bst); oracle_subdir_candidates is
# expected to never match, and that is correct (the tests are still
# counted/copied because they are part of source_rel_path). The ground-truth
# javascript/translated.js is solution-only (no test-shaped functions) --
# translating source.py's embedded tests into a new JS test file is exactly
# the RQ2 "source test -> translated test" mapping this dataset exercises.
oracle_subdir_candidates = ["tests", "test", "oracle"]
scaffold_subdir_candidates = []
# Verified: the real target dir is `javascript/translated.js` (a single file).
ground_truth_subdir_candidates = ["javascript", "js", "target", "reference", "solution"]
source_extensions = [".py"]
build_cmd = ["node", "--check", "index.js"]
unit_test_cmd = ["npm", "test", "--silent"]
validate_cmd = ["npm", "test", "--silent"]
gate_template = "{tests_space}"
# collect.py records the official-harness standardized pair; paper_test_compare
# runs c8 over the independent oracle plus classified CodeWeaver tests while
# suppressing target-suite side effects in its temporary evaluator copy.
coverage_cmd = []
coverage_format = ""
